# Independent Model E 320-pair experiment; does not alter the original 256/64 run.
experiment: model_e_two_skip_full_320
seed: 42

data:
  # ALL 320 NOISY/GT pairs from SIDD Medium sRGB used for training.
  # SIDD Validation .mat (1280 blocks) is external and must not be used for checkpoint selection.
  root: data/SIDD_Medium_Srgb/Data
  expected_pairs: 320
  patch_size: 128
  patches_per_image: 4
  memory_budget_mb: 1024

model:
  architecture: two_skip_cae
  filters: [16, 32, 48, 32, 16, 16, 3]

training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0001
  output: runs/model_e_320pairs
