experiment: model_d_paper_guided_7conv
seed: 42

data:
  split: runs/sidd_split.json
  root: data/SIDD_Medium_Srgb/Data
  expected_pairs: 320
  validation_fraction: 0.2
  patch_size: 128
  patches_per_image: 4
  memory_budget_mb: 1024

model:
  architecture: paper_guided_cae
  filters: [16, 32, 48, 32, 16, 16, 3]

training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0001
  early_stopping_patience: 15
  reduce_lr_patience: 5
  min_learning_rate: 0.000001
  output: runs/model_d_100epochs

inference:
  tile_size: 256
  overlap: 64
  memory_budget_mb: 2048
